{% extends 'base_console.html' %}{% block title %}注册{% endblock %}{% block body %}
<main class="auth-wrap"><div class="auth-card"><div class="card"><h1 class="title">创建客户账号</h1><p class="subtitle">注册后由管理员设置有效期，无需在线充值。</p>
{% for category,message in get_flashed_messages(with_categories=true) %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label>用户名</label><input name="username" minlength="3" maxlength="40" autocomplete="username" required></div><div class="field"><label>密码（至少 8 位）</label><input name="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label>确认密码</label><input name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn btn-primary btn-block">注册</button></form><p class="muted" style="text-align:center;font-size:13px;margin:18px 0 0">已有账号？<a style="color:#4f46e5" href="{{ url_for('auth.login') }}">返回登录</a></p></div></div></main>{% endblock %}
